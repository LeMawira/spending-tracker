<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spending Tracker</title>
  <meta name="theme-color" content="#1f6f5c">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Spending</h1>
    <div class="controls">
      <select id="currency" aria-label="Currency">
        <option value="AED">AED</option>
        <option value="USD">USD</option>
      </select>
      <button id="sync">Sync</button>
    </div>
  </header>

  <main>
    <p id="status" class="status"></p>

    <section class="card hero">
      <div class="label">This week</div>
      <div id="week-total" class="big">0.00</div>
      <div id="week-range" class="muted"></div>
    </section>

    <section class="card">
      <h2>Daily</h2>
      <ul id="days" class="rows"></ul>
    </section>

    <section class="card">
      <h2>Past weeks</h2>
      <ul id="weeks" class="rows"></ul>
    </section>

    <details class="card">
      <summary>Settings</summary>
      <label for="senders">Bank sender emails (one per line)</label>
      <textarea id="senders" rows="3" placeholder="alerts@yourbank.com"></textarea>
      <button id="save-senders">Save</button>
      <hr>
      <button id="clear" class="danger">Clear all data</button>
      <p class="muted small">Only emails from these senders are requested. Only the amount, currency and date are saved, on this device only.</p>
    </details>
  </main>

  <script src="config.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="app.js"></script>
</body>
</html>
