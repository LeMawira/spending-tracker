<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Spending Tracker</title>
  <meta name="theme-color" content="#f6f5fa">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <!-- Apply the saved theme before first paint to avoid a flash -->
  <script>try { var t = JSON.parse(localStorage.getItem("st.theme")); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Spending</h1>
    <div class="controls">
      <select id="currency" aria-label="Currency">
        <option value="AED">AED</option>
        <option value="USD">USD</option>
      </select>
      <button id="theme" class="icon-btn" data-mode="auto" aria-label="Theme: auto" title="Theme">
        <svg class="i-auto" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17a8.5 8.5 0 0 0 0-17z" fill="currentColor"/></svg>
        <svg class="i-light" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-dark" viewBox="0 0 24 24"><path d="M20.5 13.2A8.5 8.5 0 1 1 10.8 3.5a6.6 6.6 0 0 0 9.7 9.7z"/></svg>
      </button>
      <button id="sync" class="primary">Sync</button>
    </div>
  </header>

  <main>
    <p id="status" class="status" role="status"></p>
    <p id="rate-note" class="note"></p>

    <div class="period-bar">
      <div class="seg" role="tablist" aria-label="Period">
        <button data-period="week" class="on" role="tab">Week</button>
        <button data-period="month" role="tab">Month</button>
      </div>
      <div class="nav">
        <button id="prev" class="icon-btn" aria-label="Previous period"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
        <button id="next" class="icon-btn" aria-label="Next period"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
      </div>
    </div>

    <section class="card hero">
      <div class="hero-top">
        <div>
          <div id="hero-label" class="hero-label"></div>
          <div id="total" class="big">0.00</div>
        </div>
        <span id="change" class="pill" hidden></span>
      </div>
      <div id="hero-meta" class="hero-meta"></div>
      <svg id="chart" class="chart" role="img" aria-label="Spending by day"></svg>
      <div id="chart-tip" class="chart-tip"></div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>Transactions</h2>
        <select id="sort" aria-label="Sort transactions">
          <option value="date">Newest</option>
          <option value="amount">Largest</option>
        </select>
      </div>
      <div class="filter-row">
        <input id="search" type="search" placeholder="Search merchants" autocomplete="off" aria-label="Search merchants">
        <button id="clear-day" class="chip" hidden></button>
      </div>
      <ul id="tx" class="tx-list"></ul>
    </section>

    <section class="card">
      <h2>Top merchants</h2>
      <ul id="top" class="top-list"></ul>
    </section>

    <section class="card">
      <div class="card-head">
        <h2 id="history-title">Weekly totals</h2>
        <span id="history-avg" class="muted small"></span>
      </div>
      <svg id="history" class="chart history" role="img" aria-label="Totals over time"></svg>
    </section>

    <details class="card settings">
      <summary>Settings</summary>
      <label for="senders">Bank sender emails (one per line)</label>
      <textarea id="senders" rows="3" placeholder="alerts@yourbank.com"></textarea>
      <button id="save-senders" class="primary">Save</button>
      <hr>
      <button id="clear" class="danger">Clear all data</button>
      <p class="muted small">Only emails from these senders are requested. Only the amount, currency, date and merchant name are saved, on this device only.</p>
    </details>
  </main>

  <script src="config.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="app.js"></script>
</body>
</html>
